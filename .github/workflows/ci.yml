name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Security check
        run: node scripts/security-check.js
      
      - name: Generate registry
        run: node scripts/generate-registry.js
      
      - name: Commit registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@jsql.dev"
          git add registry.json
          git diff --exit-code --quiet || git commit -m "chore: update registry"
          git push origin refs/heads/main

  auto-merge:
    needs: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - name: Auto merge PR
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
