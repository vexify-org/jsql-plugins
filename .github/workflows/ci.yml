name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Security check
        run: node scripts/security-check.js
      
      - name: Generate registry
        run: node scripts/generate-registry.js
      
      - name: Commit registry
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@jsql.dev"
          if git diff --exit-code --quiet registry.json; then
            echo "No registry changes"
          else
            git add registry.json
            git commit -m "chore: update registry"
            git push origin main
            echo "Registry updated ✅"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    needs: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # 先 checkout main 分支
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      # 合并 PR
      - name: Merge PR
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for merge
        run: sleep 3

      - name: Update registry after merge
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@jsql.dev"
          
          node scripts/generate-registry.js
          
          if git diff --exit-code --quiet registry.json; then
            echo "No registry changes"
          else
            git add registry.json
            git commit -m "chore: update registry after PR merge"
            git push origin main
            echo "Registry updated ✅"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
