name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Security check
        run: node scripts/security-check.js

      - name: Sync registry JSON
        run: node scripts/sync-registry.js

      - name: Commit registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@jsql.dev"
          git add registry.json manifest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync registry JSON"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/vexify-org/jsql-plugins.git" HEAD:main
          fi
