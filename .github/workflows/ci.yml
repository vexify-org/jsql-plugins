name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Security check
        run: node scripts/security-check.js
      
      - name: Generate registry
        run: node scripts/generate-registry.js

  auto-merge:
    needs: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # 1. 先拉取 main，为 git 操作准备
      - name: Prepare repo
        run: |
          git fetch origin main --depth=1
          git checkout main

      # 2. 合并 PR
      - name: Merge PR
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 等 merge 完成
      - name: Wait for merge
        run: sleep 3

      # 4. 更新 registry
      - name: Update registry
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@jsql.dev"
          
          node scripts/generate-registry.js
          
          if git diff --exit-code --quiet registry.json; then
            echo "No registry changes"
          else
            git add registry.json
            git commit -m "chore: update registry after PR merge"
            git push origin main
            echo "Registry updated ✅"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
