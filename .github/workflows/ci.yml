name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Security check
        run: node scripts/security-check.js
      
      - name: Generate registry
        run: node scripts/generate-registry.js

  auto-merge:
    needs: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # 1. 先合并 PR
      - name: Merge PR
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 等 merge 完成（需要 fetch latest）
      - name: Wait for merge to complete
        run: |
          sleep 3
          git fetch origin main --depth=1
          git checkout main

      # 3. 检查是否有新插件需要注册
      - name: Update registry.json
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@jsql.dev"
          
          node scripts/generate-registry.js
          
          if git diff --exit-code --quiet registry.json; then
            echo "No registry changes, skipping"
          else
            git add registry.json
            git commit -m "chore: update registry"
            git push origin main
            echo "REGISTRY_UPDATED=true" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 成功通知（可选）
      - name: Notify success
        if: env.REGISTRY_UPDATED == 'true'
        run: echo "✅ Registry updated after PR merge"
